<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <h1>👶 Baby Monitor</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="stats">Stats</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </nav>
</header>

<main id="app">
  <section id="tab-dashboard" class="tab-panel active">
    <div id="cards" class="cards"></div>
  </section>

  <section id="tab-history" class="tab-panel">
    <div class="row filter-row">
      <select id="history-filter"><option value="">All types</option></select>
      <button id="history-refresh" class="btn secondary">Refresh</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </section>

  <section id="tab-stats" class="tab-panel">
    <div class="row filter-row">
      <select id="stats-type"></select>
      <select id="stats-days">
        <option value="1">Last 24h</option>
        <option value="7" selected>Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </div>
    <div id="stats-summary" class="stats-summary"></div>
    <div id="stats-charts"></div>
  </section>

  <section id="tab-settings" class="tab-panel">
    <div id="profile-box" class="profile-box"></div>
    <div id="settings-list" class="settings-list"></div>
  </section>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Log event</h2>
      <button id="modal-close" class="icon-btn">✕</button>
    </div>
    <form id="modal-form"></form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
