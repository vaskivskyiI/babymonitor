<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Baby Monitor</title>
<meta name="description" content="Track diaper changes, feeding, sleep, pumping and weight.">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baby Monitor">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
<link rel="manifest" href="/static/manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <h1>👶 Baby Monitor</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard" data-i18n="Dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="history" data-i18n="History">History</button>
    <button class="tab-btn" data-tab="stats" data-i18n="Stats">Stats</button>
    <button class="tab-btn" data-tab="competition" data-i18n="Competition">Competition</button>
    <button class="tab-btn" data-tab="settings" data-i18n="Settings">Settings</button>
  </nav>
</header>

<main id="app">
  <section id="tab-dashboard" class="tab-panel active">
    <div id="baby-info-bar" class="baby-info-bar hidden"></div>
    <div id="cards" class="cards"></div>
  </section>

  <section id="tab-history" class="tab-panel">
    <div class="row filter-row">
      <select id="history-filter"><option value="" data-i18n="All types">All types</option></select>
      <button id="history-refresh" class="btn secondary" data-i18n="Refresh">Refresh</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </section>

  <section id="tab-stats" class="tab-panel">
    <div id="stats-overview"></div>
    <div id="stats-detail" class="hidden">
      <div class="stats-toolbar">
        <button id="stats-back-btn" class="btn secondary" data-i18n="← All">← All</button>
        <div id="stats-type-chips" class="chip-row"></div>
      </div>
      <div class="stats-controls">
        <div class="control-group">
          <span class="control-label" data-i18n="Period">Period</span>
          <div id="stats-period-chips" class="chip-row"></div>
        </div>
        <div class="control-group">
          <span class="control-label" data-i18n="Forecast">Forecast</span>
          <div id="stats-forecast-chips" class="chip-row"></div>
        </div>
      </div>
      <div id="stats-notice"></div>
      <div id="stats-insights"></div>
      <div id="stats-ahead"></div>
      <div id="stats-charts"></div>
      <div id="calculator-box" class="hidden"></div>
    </div>
  </section>

  <section id="tab-competition" class="tab-panel">
    <div class="row filter-row">
      <select id="competition-days">
        <option value="1" data-i18n="Last 24h">Last 24h</option>
        <option value="7" selected data-i18n="Last 7 days">Last 7 days</option>
        <option value="14" data-i18n="Last 14 days">Last 14 days</option>
        <option value="30" data-i18n="Last 30 days">Last 30 days</option>
        <option value="90" data-i18n="Last 90 days">Last 90 days</option>
        <option value="365" data-i18n="Last year">Last year</option>
        <option value="all" data-i18n="All time">All time</option>
      </select>
    </div>
    <div id="competition-content"></div>
  </section>

  <section id="tab-settings" class="tab-panel">
    <div class="settings-row">
      <div><strong data-i18n="Language">Language</strong></div>
      <select id="lang-switcher" class="lang-switcher">
        <option value="en">EN</option>
        <option value="uk">UK</option>
      </select>
    </div>
    <div id="profile-box" class="profile-box"></div>
    <div class="section-heading"><h2 data-i18n="People">People</h2></div>
    <div id="people-manager" class="people-manager"></div>
    <div class="section-heading">
      <h2 data-i18n="Chore types">Chore types</h2>
      <button id="add-chore-type-btn" class="btn secondary" data-i18n="+ Add">+ Add</button>
    </div>
    <div id="chore-types-manager" class="chore-types-manager"></div>
    <div class="section-heading"><h2 data-i18n="Push notifications">Push notifications</h2></div>
    <div id="push-box" class="push-box"></div>
    <div class="section-heading"><h2 data-i18n="Reminders">Reminders</h2></div>
    <div id="settings-list" class="settings-list"></div>
  </section>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Log event</h2>
      <button id="modal-close" class="icon-btn">✕</button>
    </div>
    <form id="modal-form"></form>
  </div>
</div>

<div id="ct-modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="ct-modal-title">Add chore type</h2>
      <button id="ct-modal-close" class="icon-btn">✕</button>
    </div>
    <form id="ct-modal-form"></form>
  </div>
</div>

<div id="due-modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="due-modal-title">Next reminder</h2>
      <button id="due-modal-close" class="icon-btn">✕</button>
    </div>
    <div id="due-modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>
