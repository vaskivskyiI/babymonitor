name: HACS validation

on:
  push:
    paths:
      - "custom_components/**"
      - "hacs.json"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
